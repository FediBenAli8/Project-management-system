<div class="top-nav">
  <div class="brand">TaskAura</div>
  <div class="top-actions">
    @if (!auth.isLoggedIn()) {
      <a routerLink="/login" routerLinkActive="active" class="top-btn">Login</a>
      <a routerLink="/register" routerLinkActive="active" class="top-btn register-btn">Register</a>
    } @else {
      <button (click)="logout()" class="top-btn logout-btn">Logout</button>
    }
  </div>
</div>
<div class="animated-bg-layer"></div>
<div class="app-shell">
  <app-side-bar></app-side-bar>
  <main class="content-shell">
    <router-outlet></router-outlet>
  </main>
</div>
